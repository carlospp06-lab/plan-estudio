<script>
const COLORS=['#3D7EDB','#D9534F','#2E9E6B','#9B59B6','#E08A1E','#1F9FB0','#C2477A','#7A8A2E'];
const DOW=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const DIFF=['Muy fácil','Fácil','Normal','Difícil','Muy difícil'];
const PRIO=['Mínima','Baja','Media','Alta','Máxima'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- fechas ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>(pd(s).getDay()+6)%7;
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=()=>ymd(new Date());
const fmtDate=(s,o={weekday:'short',day:'numeric',month:'short'})=>pd(s).toLocaleDateString('es-ES',o);
function fmtH(h){const m=Math.round(h*60);const hh=Math.floor(m/60),mm=m%60;if(!hh)return mm+' min';return hh+' h'+(mm?' '+mm+' min':'')}
const until=s=>{const n=diffDays(today(),s);return n===0?'hoy':n===1?'mañana':n<0?'pasado':'en '+n+' días'};

/* ---------- estado ---------- */
const DEFAULT={subjects:[],settings:{hours:[3,3,3,3,2,3,1],margin:0.2,start:'09:00'},log:{}};
let state=structuredClone(DEFAULT);
let tab='hoy', editing=null, storeMode='cargando';

/* ---------- modelo de trabajo ---------- */
const topicTotal=s=>s.topics.reduce((a,t)=>a+(+t.hours||0),0);
const reviewHours=s=>s.noReview?0:s.topics.length?Math.max(1,Math.round(topicTotal(s)*0.15*2)/2):0;
function units(s){const u=s.topics.map(t=>({id:t.id,name:t.name,hours:+t.hours||0,studied:+t.studied||0}));if(u.length&&!s.noReview)u.push({id:'__rev',name:'Repaso general',hours:reviewHours(s),studied:+s.reviewStudied||0});return u}
const remaining=s=>units(s).reduce((a,u)=>a+Math.max(0,u.hours-u.studied),0);
const totalH=s=>units(s).reduce((a,u)=>a+u.hours,0);
const findS=id=>state.subjects.find(s=>s.id===id);
const defaultHours=s=>1+0.5*(s.difficulty||3);

function topicsSlice(s,start,h,full){const out=[];let pos=0;for(const u of units(s)){const r=Math.max(0,u.hours-u.studied);if(r<=0)continue;const lo=Math.max(pos,start),hi=Math.min(pos+r,start+h);if(hi-lo>0.01)out.push(full?{u,t:s.topics.find(x=>x.id===u.id),h:hi-lo}:u.name);pos+=r;if(pos>=start+h)break}return out}

/* ---------- planificador ----------
   Cada día reparte las horas pendientes de cada asignatura entre los días de estudio que quedan
   hasta su examen (con margen para terminar antes). Si no caben, reparte la capacidad del día
   según prioridad y dificultad, y avisa de lo que no llega. */
const hourOf=s=>{if(!s)return null;const[h,m]=s.split(':').map(Number);return isNaN(h)?null:h+(m||0)/60};
/* Horas para estudiar el mismo día del examen: desde la hora de inicio hasta 1 h antes del examen */
function examWindow(s,d){
  const T=hourOf(s.time);if(T==null||d!==s.exam)return 0;
  let st=hourOf(state.settings.start)??9;
  if(d===today()){const n=new Date();st=Math.max(st,n.getHours()+n.getMinutes()/60)}
  return Math.max(0,Math.floor((T-st-1)*4)/4);
}
function buildPlan(){
  const t=today(), H=state.settings.hours, margin=state.settings.margin;
  const subs=state.subjects.filter(s=>s.exam&&s.topics.length&&(s.exam>t||(s.exam===t&&examWindow(s,t)>=0.25)));
  const rem={}, tl=state.log[t]||{};
  subs.forEach(s=>rem[s.id]=remaining(s)+(tl[s.id]?.h||0));
  const last=subs.reduce((m,s)=>{const e=examWindow(s,s.exam)>=0.25?addDays(s.exam,1):s.exam;return e>m?e:m},t);
  const left=(s,d)=>{let n=0;for(let x=d;x<s.exam;x=addDays(x,1))if(H[dow(x)]>0)n++;if(H[dow(s.exam)]>0&&examWindow(s,s.exam)>=0.25)n++;return n};
  const days=[];
  for(let d=t;d<last;d=addDays(d,1)){
    const cap=+H[dow(d)]||0, day={date:d,cap,items:[],over:0};
    /* Reparto elegido a mano para este día: state.overrides[fecha] = {idAsignatura: horas}.
       Lo que no se estudia ese día queda pendiente y se reparte en los días siguientes. */
    const ov=state.overrides?.[d];
    if(cap>0&&ov){
      day.custom=true;
      subs.forEach(s=>{if(!(s.exam>d||(s.exam===d&&examWindow(s,d)>=0.25)))return;let h=Math.min(+ov[s.id]||0,rem[s.id]);if(s.exam===d)h=Math.min(h,examWindow(s,d));if(h<0.01)return;rem[s.id]=Math.max(0,rem[s.id]-h);day.items.push({sid:s.id,h})});
      day.items.sort((a,b)=>b.h-a.h);days.push(day);continue;
    }
    if(cap>0){
      const act=subs.filter(s=>rem[s.id]>0.01&&(s.exam>d||(s.exam===d&&examWindow(s,d)>=0.25))).map(s=>{
        const n=left(s,d), eff=Math.max(1,n*(1-margin));
        let want=n<=1?rem[s.id]:Math.min(rem[s.id],rem[s.id]/eff);
        if(s.exam===d)want=Math.min(want,examWindow(s,d));
        const w=want*(0.6+0.2*(s.priority||3))*(0.8+0.1*(s.difficulty||3));
        return {s,want,w,a:0,need:s.exam===d?want:rem[s.id]/Math.max(1,n)};});
      const sumWant=act.reduce((a,x)=>a+x.want,0);
      day.over=Math.max(0,act.reduce((a,x)=>a+x.need,0)-cap);
      if(sumWant<=cap) act.forEach(x=>x.a=x.want);
      else{
        let capLeft=cap, pool=act.slice();
        for(let i=0;i<3&&capLeft>0.01&&pool.length;i++){
          const sw=pool.reduce((a,x)=>a+x.w,0);let used=0;
          pool.forEach(x=>{const g=Math.min(x.want-x.a,capLeft*x.w/sw);x.a+=g;used+=g});
          capLeft-=used;pool=pool.filter(x=>x.want-x.a>0.01);
        }
      }
      act.forEach(x=>{let h=Math.round(x.a*4)/4;if(h<0.25&&x.a>0.05)h=Math.min(0.25,rem[x.s.id]);if(h<=0)return;h=Math.min(h,Math.ceil(rem[x.s.id]*4)/4);rem[x.s.id]=Math.max(0,rem[x.s.id]-h);day.items.push({sid:x.s.id,h})});
      day.items.sort((a,b)=>b.h-a.h);
    }
    days.push(day);
  }
  const unmet=subs.filter(s=>rem[s.id]>0.1).map(s=>({s,h:rem[s.id]}));
  return {days,unmet};
}

/* ---------- registrar estudio ---------- */
/* Registra h horas de estudio hoy. Se puede llamar varias veces: el tiempo se acumula. */
let logOpen=null, logVal=0;
function markDone(sid,h,first){
  h=Math.round((+h||0)*60)/60;if(h<=0)return;
  const s=findS(sid), t=today();let left=h;const d=[];
  if(first&&first!=='__rev'){const tp=s.topics.find(x=>x.id===first);if(tp){const r=Math.max(0,(+tp.hours||0)-(+tp.studied||0));const a=Math.min(r,left);if(a>0){tp.studied=(+tp.studied||0)+a;d.push([tp.id,a]);left-=a}}}
  if(first==='__rev'&&!s.noReview&&left>1e-6){const r=Math.max(0,reviewHours(s)-(+s.reviewStudied||0));const a=Math.min(r,left);if(a>0){s.reviewStudied=(+s.reviewStudied||0)+a;d.push(['__rev',a]);left-=a}}
  if(left>1e-6)for(const tp of s.topics){const r=Math.max(0,(+tp.hours||0)-(+tp.studied||0));if(r<=0)continue;const a=Math.min(r,left);tp.studied=(+tp.studied||0)+a;d.push([tp.id,a]);left-=a;if(left<=1e-6)break}
  if(left>1e-6){s.reviewStudied=(+s.reviewStudied||0)+left;d.push(['__rev',left])}
  const L=(state.log[t]??={});if(L[sid]){L[sid].h+=h;L[sid].d.push(...d)}else L[sid]={h,d};
  logOpen=null;save();toast('Registrado: '+fmtH(h));render();
}
function undoDone(sid){
  const t=today(),e=state.log[t]?.[sid];if(!e)return;const s=findS(sid);
  if(s)e.d.forEach(([id,a])=>{if(id==='__rev')s.reviewStudied=Math.max(0,(+s.reviewStudied||0)-a);else{const tp=s.topics.find(x=>x.id===id);if(tp)tp.studied=Math.max(0,(+tp.studied||0)-a)}});
  delete state.log[t][sid];logOpen=null;save();toast('Registro de hoy deshecho');render();
}

/* ---------- temporizador ----------
   Guarda solo marcas de tiempo (no cuenta segundos), así sigue contando aunque cierres la app
   o el móvil la congele en segundo plano. state.timer = {sid, start|null, acc(ms), notified} */
let tickT=null, goalT=null;
const tElapsed=()=>{const T=state.timer;if(!T)return 0;return (T.acc||0)+(T.start?Date.now()-T.start:0)};
const fmtClock=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
function todayLeft(sid){const it=(buildPlan().days[0]?.items||[]).find(x=>x.sid===sid);if(!it)return 0;return Math.max(0,it.h-(state.log[today()]?.[sid]?.h||0))}
async function swReg(){try{return 'serviceWorker' in navigator?await navigator.serviceWorker.getRegistration():null}catch(e){return null}}
async function notify(title,body,opts={}){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const r=await swReg();const o={body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'plan-timer',lang:'es',...opts};
  try{if(r)await r.showNotification(title,o);else new Notification(title,o)}catch(e){}
}
async function clearNotify(){const r=await swReg();try{(await r?.getNotifications({tag:'plan-timer'}))?.forEach(n=>n.close())}catch(e){}}
const tLabel=T=>{const s=findS(T.sid);return (s?.name||'')+(T.uname?' · '+T.uname:'')};
function timerNotify(){
  const T=state.timer;if(!T){clearNotify();return}const s=findS(T.sid);if(!s)return;const nm=tLabel(T);
  const goal=T.goalH*3600e3;
  if(T.start){
    const end=new Date(Date.now()+Math.max(0,goal-tElapsed()));
    notify('Estudiando '+nm,(goal>tElapsed()?'Objetivo de hoy hacia las '+end.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'Objetivo de hoy cumplido')+' · Toca para abrir',{silent:true,renotify:false,requireInteraction:true,timestamp:T.start-(T.acc||0)});
  }else notify('En pausa: '+nm,'Llevas '+fmtH(tElapsed()/3600e3)+'. Toca para reanudar.',{silent:true,requireInteraction:true});
}
function scheduleGoal(){
  clearTimeout(goalT);const T=state.timer;if(!T||!T.start||T.notified)return;
  const ms=T.goalH*3600e3-tElapsed();
  if(ms<=0){goalReached();return}
  goalT=setTimeout(goalReached,Math.min(ms,2**31-1));
}
function goalReached(){
  const T=state.timer;if(!T||T.notified)return;T.notified=true;writeNow();
  const s=findS(T.sid);try{navigator.vibrate?.([200,100,200])}catch(e){}
  if(document.visibilityState==='visible')toast('¡Tiempo cumplido: '+tLabel(T)+'!');
  notify('Tiempo cumplido: '+tLabel(T),'Ya llevas el tiempo previsto para hoy. Para el temporizador para registrarlo.',{tag:'plan-timer',renotify:true,silent:false,requireInteraction:true});
}
async function askNotify(){
  if(!('Notification' in window)||Notification.permission!=='default')return;
  try{await Notification.requestPermission()}catch(e){}
}
/* Un temporizador por concepto (unit = id del tema o '__rev'). Solo uno en marcha a la vez:
   si empiezas otro, el anterior se para y se registra en su concepto. */
const sameT=(T,sid,unit)=>T&&T.sid===sid&&(T.unit||null)===(unit||null);
function timerStart(sid,unit,goalH,uname){
  const T=state.timer;
  if(T&&!sameT(T,sid,unit)){const ms=tElapsed();state.timer=null;if(ms>=60e3)markDone(T.sid,ms/3600e3,T.unit)}
  if(sameT(state.timer,sid,unit)){state.timer.start=Date.now()}
  else state.timer={sid,unit:unit||null,uname:uname||'',start:Date.now(),acc:0,goalH:goalH!=null&&!isNaN(goalH)?goalH:todayLeft(sid),notified:false};
  writeNow();askNotify().then(timerNotify);scheduleGoal();render();
}
function timerPause(){const T=state.timer;if(!T||!T.start)return;T.acc=tElapsed();T.start=null;clearTimeout(goalT);writeNow();timerNotify();render()}
function timerStop(){
  const T=state.timer;if(!T)return;const ms=tElapsed();state.timer=null;clearTimeout(goalT);writeNow();clearNotify();
  if(ms<60e3){toast('Menos de 1 minuto: no se registra');render();return}
  markDone(T.sid,ms/3600e3,T.unit);
}
function timerDiscard(){if(!state.timer)return;if(!confirm('¿Descartar el tiempo del temporizador sin registrarlo?'))return;state.timer=null;clearTimeout(goalT);writeNow();clearNotify();toast('Temporizador descartado');render()}
function timerBlock(s,unit,goalH,uname){
  const T=state.timer, mine=sameT(T,s.id,unit);
  const attrs=`data-tstart="${s.id}" data-tunit="${esc(unit||'')}" data-tgoalh="${goalH}" data-tuname="${esc(uname||'')}"`;
  if(!mine)return `<div class="row"><button class="mark" ${attrs} style="flex:1">▶ Empezar · ${fmtH(goalH)}</button></div>`;
  const el=tElapsed(), goal=T.goalH*3600e3, rem=goal-el;
  return `<div class="timer ${T.start?'on':''}">
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div class="stack" style="gap:4px"><span class="state">${T.start?'<span class="pulse"></span>Estudiando':'En pausa'}</span><span class="clock" data-tclock>${fmtClock(el)}</span></div>
    <button class="ghost" data-tdiscard aria-label="Descartar temporizador" title="Descartar">✕</button></div>
    ${goal>0?`<div class="bar" aria-hidden="true"><span data-tbar style="width:${Math.min(100,el/goal*100)}%;background:var(--c)"></span></div>`:''}
    <span class="goal ${goal>0&&rem<=0?'reached':''}" data-tgoal>${goal>0?(rem>0?'Quedan '+fmtClock(rem)+' para el objetivo de hoy':'Objetivo de hoy cumplido · '+fmtClock(-rem)+' extra'):'Tiempo extra para hoy'}</span>
    <div class="row">${T.start?`<button data-tpause style="flex:1">❚❚ Pausar</button>`:`<button class="mark" ${attrs} style="flex:1">▶ Reanudar</button>`}<button class="primary" data-tstop style="flex:1;white-space:nowrap">■ Parar</button></div>
  </div>`;
}
function timerBar(){
  const b=$('#timerbar'),T=state.timer,s=T&&findS(T.sid);
  const show=!!(s&&!(tab==='hoy'&&!editing));
  document.body.classList.toggle('has-timerbar',show);
  if(!show){b.hidden=true;return}
  b.hidden=false;b.style.setProperty('--c',s.color);
  b.innerHTML=`<span class="nm">${T.start?'<span class="pulse"></span>':'❚❚ '}${esc(tLabel(T))}</span><span class="num" data-tclock>${fmtClock(tElapsed())}</span>${T.start?'<button data-tpause>Pausar</button>':`<button data-tstart="${s.id}" data-tunit="${esc(T.unit||'')}" data-tgoalh="${T.goalH}" data-tuname="${esc(T.uname||'')}">Reanudar</button>`}<button data-tstop>Parar</button>`;
}
function tick(){
  const T=state.timer;
  document.querySelectorAll('[data-tclock]').forEach(e=>e.textContent=fmtClock(tElapsed()));
  if(T){const goal=T.goalH*3600e3,el=tElapsed(),rem=goal-el;
    document.querySelectorAll('[data-tbar]').forEach(e=>e.style.width=Math.min(100,goal?el/goal*100:0)+'%');
    document.querySelectorAll('[data-tgoal]').forEach(e=>{if(goal>0){e.textContent=rem>0?'Quedan '+fmtClock(rem)+' para el objetivo de hoy':'Objetivo de hoy cumplido · '+fmtClock(-rem)+' extra';e.classList.toggle('reached',rem<=0)}});
    if(T.start&&!T.notified&&goal>0&&rem<=0)goalReached();
  }
}
function startTicker(){clearInterval(tickT);tickT=setInterval(()=>{if(state.timer?.start&&document.visibilityState==='visible')tick()},1000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.timer){tick();scheduleGoal()}});

/* ---------- reparto del día (porcentajes) ----------
   El total del día se mantiene: al subir una asignatura 15 min se quitan a otra. */
let splitDate=null, splitDraft=null, splitTotal=0, splitMin={}, splitMax={};
function splitCandidates(d){return state.subjects.filter(s=>s.exam&&s.topics.length&&(s.exam>d||(s.exam===d&&examWindow(s,d)>=0.25))&&(remaining(s)+(d===today()?(state.log[today()]?.[s.id]?.h||0):0))>0.01)}
function openSplit(d){
  const day=buildPlan().days.find(x=>x.date===d);if(!day||!day.cap){toast('Ese día no tienes horas de estudio');return}
  splitDate=d;splitDraft={};splitMin={};splitMax={};splitPending=null;splitEdit=null;
  const tl=d===today()?(state.log[d]||{}):{};
  for(const s of splitCandidates(d)){
    splitDraft[s.id]=day.items.find(i=>i.sid===s.id)?.h||0;
    splitMin[s.id]=Math.ceil((tl[s.id]?.h||0)*4)/4;
    splitMax[s.id]=remaining(s)+(tl[s.id]?.h||0);
  }
  splitTotal=Object.values(splitDraft).reduce((a,b)=>a+b,0);
  if(splitTotal<0.25)splitTotal=day.cap;
  renderSplit();
}
function closeSplit(){splitDate=null;$('#split').hidden=true;document.body.style.overflow='';render()}
/* Cambiar el tiempo de una asignatura: primero se elige cuánto (±15' o minutos escritos a mano)
   y luego de qué asignatura se quita (o a cuál se da), para no tocar las que no quieres. */
let splitPending=null, splitEdit=null;
const qm=x=>Math.round(x*60)/60;
function splitPartners(sid,dv){
  return Object.keys(splitDraft).filter(i=>i!==sid).map(i=>{
    const room=dv>0?splitDraft[i]-splitMin[i]:splitMax[i]-splitDraft[i];
    return {i,ok:room>=Math.abs(dv)-1e-6,room:Math.max(0,room)};
  });
}
function splitStep(sid,dv){
  dv=qm(dv);if(!dv)return;
  if(dv>0&&splitDraft[sid]+dv>splitMax[sid]+1/120){toast('A '+findS(sid).name+' solo le quedan '+fmtH(splitMax[sid])+' de temario');return}
  if(dv<0&&splitDraft[sid]+dv<splitMin[sid]-1e-6){toast(splitMin[sid]>0?'Hoy ya llevas '+fmtH(splitMin[sid])+' de esta asignatura':'No puedes quitar más de '+fmtH(splitDraft[sid]));return}
  const ok=splitPartners(sid,dv).filter(x=>x.ok);
  if(!ok.length){toast(dv>0?'Ninguna otra asignatura tiene '+fmtH(dv)+' para darte':'Ninguna otra asignatura puede recibir '+fmtH(-dv));return}
  splitEdit=null;
  if(Object.keys(splitDraft).length===2){splitApply(sid,dv,ok[0].i);return}
  splitPending={sid,dv};renderSplit();setTimeout(()=>$('#spicker')?.scrollIntoView({block:'center',behavior:'smooth'}),30);
}
function splitApply(sid,dv,other){
  splitDraft[other]=qm(splitDraft[other]-dv);splitDraft[sid]=qm(splitDraft[sid]+dv);
  const o=findS(other).name;splitPending=null;
  toast(dv>0?`+${fmtH(dv)} · quitado de ${o}`:`−${fmtH(-dv)} · dado a ${o}`);renderSplit();
}
function splitCustom(sign){
  const v=Math.round(+($('#smin')?.value||0));
  if(!(v>0)){toast('Escribe los minutos');$('#smin')?.focus();return}
  splitStep(splitEdit,sign*v/60);
}
function saveSplit(){(state.overrides??={})[splitDate]={...splitDraft};save();toast('Reparto guardado');closeSplit()}
function resetSplit(){if(state.overrides)delete state.overrides[splitDate];save();toast('Reparto automático');closeSplit()}
function renderSplit(){
  const el=$('#split'),ids=Object.keys(splitDraft),tot=ids.reduce((a,i)=>a+splitDraft[i],0)||1;
  const custom=!!state.overrides?.[splitDate];
  el.innerHTML=`<main><div class="sheethead"><button class="ghost" data-splitclose>← Volver</button><span class="savestate">${custom?'Reparto a mano':'Reparto automático'}</span></div>
  <header class="stack" style="gap:6px"><span class="eyebrow">${esc(fmtDate(splitDate,{weekday:'long',day:'numeric',month:'long'}))}</span><h1>Reparto <span class="hl">del día</span></h1>
  <span class="muted">Usa ±15' o toca el tiempo (✎) para escribir los minutos; después eliges de qué asignatura sale ese tiempo. El total se mantiene en <span class="num">${fmtH(splitTotal)}</span>; lo que quites hoy se reparte en los días siguientes.</span></header>
  <div class="bar" style="height:14px" aria-hidden="true">${ids.map(i=>`<span style="width:${splitDraft[i]/tot*100}%;background:${findS(i).color}"></span>`).join('')}</div>
  <section class="card" style="padding-block:4px">${ids.map(i=>{const s=findS(i);return`<div class="splitrow">
    <div style="min-width:0"><div class="row" style="gap:8px;flex-wrap:nowrap"><span class="dot" style="background:${s.color}"></span><strong style="min-width:0">${esc(s.name)}</strong></div><span class="muted" style="font-size:.85rem">Examen ${until(s.exam)}</span></div>
    <span class="pct">${Math.round(splitDraft[i]/tot*100)}%</span>
    <div class="ctl" style="grid-column:1/-1;justify-content:space-between"><button data-sstep="${i}" data-v="-0.25" aria-label="15 minutos menos de ${esc(s.name)}">−15'</button><button class="ghost num" data-sedit="${i}" aria-label="Escribir minutos para ${esc(s.name)}" style="min-width:110px;font-size:1.05rem;text-decoration:underline dotted;text-underline-offset:4px">${fmtH(splitDraft[i])} ✎</button><button data-sstep="${i}" data-v="0.25" aria-label="15 minutos más de ${esc(s.name)}">+15'</button></div>
    ${splitEdit===i?`<div class="stack" style="grid-column:1/-1;gap:8px;background:var(--bg);border-radius:10px;padding:10px"><label class="f" for="smin">¿Cuántos minutos?</label><div class="row" style="flex-wrap:nowrap;gap:8px"><input id="smin" type="number" inputmode="numeric" min="1" step="1" placeholder="Ej. 20" style="flex:1;min-width:0"><button data-scustom="-1">− Quitar</button><button class="primary" data-scustom="1">+ Añadir</button></div><button class="ghost" data-seditcancel style="align-self:flex-start;min-height:0;padding:2px 0;font-size:.85rem">Cancelar</button></div>`:''}
    ${splitPending?.sid===i?`<div id="spicker" class="stack" style="grid-column:1/-1;gap:8px;border:2px solid var(--mark);border-radius:10px;padding:10px"><strong>${splitPending.dv>0?`¿De qué asignatura quito ${fmtH(splitPending.dv)}?`:`¿A qué asignatura le doy ${fmtH(-splitPending.dv)}?`}</strong>
      ${splitPartners(i,splitPending.dv).map(x=>{const o=findS(x.i);return`<button data-spick="${x.i}" ${x.ok?'':'disabled'} style="justify-content:space-between"><span class="row" style="gap:8px;flex-wrap:nowrap;min-width:0"><span class="dot" style="background:${o.color}"></span><span style="min-width:0;text-align:left">${esc(o.name)}</span></span><span class="num muted" style="font-weight:400">${splitPending.dv>0?'tiene '+fmtH(splitDraft[x.i]):'puede +'+fmtH(x.room)}</span></button>`}).join('')}
      <button class="ghost" data-spickcancel style="align-self:flex-start;min-height:0;padding:2px 0;font-size:.85rem">Cancelar</button></div>`:''}
  </div>`}).join('')}</section>
  <div class="row"><button class="primary" data-splitsave style="flex:1">Guardar reparto</button>${custom?'<button data-splitreset>Volver al automático</button>':''}</div>
  </main>`;
  el.hidden=false;document.body.style.overflow='hidden';
}
function splitButton(d,items){
  const tot=items.reduce((a,x)=>a+x.h,0);if(!tot)return'';
  const custom=!!state.overrides?.[d];
  return `<button class="splitbtn ${custom?'mark':''}" data-split="${d}" aria-label="Cambiar el reparto del día"><span class="mini">${items.map(x=>`<span style="width:${x.h/tot*100}%;background:${findS(x.sid).color}"></span>`).join('')}</span>${items.length>1?items.slice(0,3).map(x=>Math.round(x.h/tot*100)+'%').join(' · '):'Reparto'}</button>`;
}

/* ---------- guardado ----------
   Los datos viven en este dispositivo (localStorage), separados del código de la app.
   Al actualizar la app solo cambia el código: los datos se leen igual y, si el formato
   cambia, migrate() los convierte. Antes de migrar se guarda una copia intacta. */
const APP_VERSION='1.9.0';
const SCHEMA=1;
const KEY='plan-estudio';
let saveTimer=null;
function prune(){const lim=addDays(today(),-60);for(const k of Object.keys(state.log))if(k<lim)delete state.log[k];if(state.overrides)for(const k of Object.keys(state.overrides))if(k<today())delete state.overrides[k]}
function writeNow(){
  prune();state.schema=SCHEMA;
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    // copia diaria de seguridad automática (la de ayer se conserva hasta mañana)
    const b=KEY+'-copia-'+today();
    if(!localStorage.getItem(b)){
      for(const k of Object.keys(localStorage))if(k.startsWith(KEY+'-copia-')&&k<KEY+'-copia-'+addDays(today(),-1))localStorage.removeItem(k);
      localStorage.setItem(b,JSON.stringify(state));
    }
  }catch(e){toast('No se pudo guardar en el móvil. Haz una copia de seguridad.')}
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(writeNow,400)}
window.addEventListener('pagehide',()=>{if(saveTimer){clearTimeout(saveTimer);writeNow()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveTimer){clearTimeout(saveTimer);writeNow()}});

/* Convierte datos de versiones anteriores al formato actual. Añadir un paso por versión. */
function migrate(x){
  let v=+x.schema||0;
  if(v<1){/* v0 = prototipo de Claude: mismo formato */ v=1}
  x.schema=v;return x;
}
function normalize(x){x=JSON.parse(JSON.stringify(x||{}));if(x.data&&x.data.subjects)x=x.data;x=migrate(x);const s=Object.assign(structuredClone(DEFAULT),x||{});s.settings=Object.assign(structuredClone(DEFAULT.settings),s.settings||{});s.subjects=(s.subjects||[]).map(z=>({topics:[],difficulty:3,priority:3,color:COLORS[0],...z}));s.log=s.log||{};return s}
function loadLocal(){
  try{
    const r=localStorage.getItem(KEY);if(!r)return;
    const raw=JSON.parse(r);
    if((+raw.schema||0)<SCHEMA)localStorage.setItem(KEY+'-antes-de-v'+SCHEMA,r);
    state=normalize(raw);
  }catch(e){toast('No se pudieron leer los datos guardados')}
}
/* Tema: 'auto' (sigue al móvil), 'light' o 'dark'. Se guarda con tus ajustes. */
function applyTheme(){
  const t=state.settings.theme||'auto',r=document.documentElement;
  if(t==='auto')delete r.dataset.theme;else r.dataset.theme=t;
  const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.content=dark?'#121411':'#F2F4EF';m.removeAttribute('media')});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>applyTheme());
function initStore(){
  storeMode='local';loadLocal();applyTheme();startTicker();if(state.timer){scheduleGoal()}
  try{navigator.storage?.persist?.()}catch(e){}
  render();
}

/* ---------- copia de seguridad ---------- */
function exportData(){
  writeNow();
  const blob=new Blob([JSON.stringify({app:'plan-estudio',version:APP_VERSION,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plan-estudio-'+today()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  try{localStorage.setItem(KEY+'-ultima-exportacion',today())}catch(e){}
  toast('Copia descargada');render();
}
/* Importar NUNCA borra nada. Sirve igual para un archivo de asignaturas
   ({type:'subjects',subjects:[…]}) que para una copia completa ({data:{…}}):
   - Asignatura nueva → se añade con su temario, fecha y hora del examen.
   - Asignatura que ya existe (mismo nombre) → se actualiza su temario y fechas,
     conservando lo ya estudiado y su color.
   - Las demás asignaturas, los ajustes (horas disponibles) y el registro no se tocan. */
const normName=s=>String(s||'').trim().toLowerCase();
function mergeSubjects(list){
  const added=[],updated=[];
  for(const raw of list){
    if(!raw||!raw.name)continue;
    const topics=(raw.topics||[]).filter(t=>t&&t.name).map(t=>({...t,id:t.id||uid(),hours:Math.max(0.5,+t.hours||defaultHours(raw)),studied:+t.studied||0}));
    const old=state.subjects.find(s=>normName(s.name)===normName(raw.name));
    /* Actualización parcial: si el archivo no trae temas, se conservan los que ya hay
       (sirve para cambiar solo la dificultad, la fecha, etc.). */
    if(old&&!Array.isArray(raw.topics)){const {name,...rest}=raw;Object.assign(old,rest,{id:old.id,topics:old.topics});updated.push(old.name);continue}
    if(!old&&!Array.isArray(raw.topics))continue;
    if(old){
      const prev=new Map(old.topics.map(t=>[normName(t.name),t]));
      topics.forEach(t=>{const p=prev.get(normName(t.name));if(p){t.id=p.id;t.studied=Math.min(Math.max(+p.studied||0,+t.studied||0),t.hours)}});
      Object.assign(old,{...raw,id:old.id,color:old.color,reviewStudied:Math.max(+old.reviewStudied||0,+raw.reviewStudied||0),topics});
      updated.push(old.name);
    }else{
      const used=new Set(state.subjects.map(s=>s.color));
      state.subjects.push({difficulty:3,priority:3,time:'',exam:'',reviewStudied:0,...raw,id:uid(),
        color:raw.color||COLORS.find(c=>!used.has(c))||COLORS[state.subjects.length%COLORS.length],topics});
      added.push(raw.name);
    }
  }
  return {added,updated};
}
function readFile(file){
  const fr=new FileReader();
  fr.onload=()=>{
    let parsed;try{parsed=JSON.parse(fr.result)}catch(e){toast('Ese archivo no es de Plan de Estudio');return}
    try{localStorage.setItem(KEY+'-antes-de-importar',JSON.stringify(state))}catch(e){}
    const src=parsed?.data?.subjects?parsed.data:parsed;
    const list=Array.isArray(src?.subjects)?src.subjects:Array.isArray(src?.updates)?src.updates:Array.isArray(src)?src:null;
    if(!list){toast('Ese archivo no es de Plan de Estudio');return}
    const {added,updated}=mergeSubjects(list);
    if(!added.length&&!updated.length){toast('El archivo no tiene asignaturas');return}
    writeNow();render();
    toast([added.length?'Añadida: '+added.join(', '):'',updated.length?'Actualizada: '+updated.join(', '):''].filter(Boolean).join(' · '));
  };
  fr.readAsText(file);
}
function pickImport(){
  const i=document.createElement('input');i.type='file';i.accept='application/json,.json,text/plain';
  i.onchange=()=>{const f=i.files[0];if(f)readFile(f)};
  i.click();
}

  ${s.topics.map(t=>`<div class="topic"><input type="checkbox" data-tdone="${t.id}" ${(+t.studied||0)>=(+t.hours||0)&&t.hours>0?'checked':''} aria-label="Concepto terminado"><div class="nm">${esc(t.name)}${t.kind||t.importance?`<div class="row" style="gap:6px;margin-top:4px">${kindChip(t)}${impDots(t)}</div>`:''}${t.freq?`<small>En exámenes: ${esc(t.freq)}</small>`:''}${t.focus?`<details><summary>Qué dominar</summary><p>${esc(t.focus)}</p>${t.where?`<p class="where">Apuntes: ${esc(t.where)}</p>`:''}</details>`:''}${t.studied>0?`<small>${fmtH(Math.min(t.studied,t.hours))} estudiadas</small>`:''}</div><input id="th-${t.id}" type="number" min="0.5" step="0.5" value="${t.hours}" data-th="${t.id}" aria-label="Horas para ${esc(t.name)}"><button class="ghost" data-tdel="${t.id}" aria-label="Quitar tema">✕</button></div>`).join('')||'<span class="muted">Todavía no hay temas.</span>'}
  <label class="f" for="newtopics">Añadir temas <span class="muted" style="font-weight:400">uno por línea, o pega el índice del temario tal cual</span></label>
  <textarea id="newtopics" placeholder="Tema 1. Semiconductores&#10;Tema 2. El diodo&#10;Tema 3. Transistor BJT">${esc(draft)}</textarea>
  <div class="row"><button data-addtopics>Añadir tal cual</button><button class="mark" data-ai>Dividir y estimar horas</button></div>
  <span class="muted" style="font-size:.85rem">«Dividir y estimar» agrupa los apartados en temas y calcula las horas según la dificultad y los apartados de cada tema. Funciona sin conexión.</span>
  <div id="aimsg" class="muted" style="font-size:.9rem"></div></section>
  ${s.omitted?.length?`<section class="card"><h2>Lo que puedes saltarte</h2><span class="muted" style="font-size:.9rem">Partes del temario que no han aparecido en los exámenes analizados. Échales un vistazo solo si te sobra tiempo.</span><ul class="omit">${s.omitted.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></section>`:''}
  <div id="delbox"><button class="danger" data-delsub>Eliminar asignatura</button></div>
  </main>`;
  sh.hidden=false;document.body.style.overflow='hidden';
}

/* ---------- estimador automático (sin conexión) ----------
   Agrupa el índice pegado en temas (Tema 1 / 1. / Unidad 2…) con sus apartados
   (1.1, a), guiones…) y estima horas según la dificultad y el número de apartados. */
const HEAD_RE=/^(tema|unidad|bloque|cap[ií]tulo|lecci[oó]n|parte|m[oó]dulo)\b\s*[\divxlc]+/i;
const NUM_HEAD_RE=/^\d{1,2}\s*[\.\)\-:]?\s+(?!\d)\S/;
const SUB_RE=/^(\d+\s*\.\s*\d+|[a-z]\s*[\)\.]\s|[-•·*–—▪◦>]\s*|\(?[ivx]+\)\s)/i;
const PROB_RE=/problem|ejercic|c[aá]lcul|resoluci|circuit|dimension|ensay|práctic|practic|aplicaci|diseñ|regulador|ajuste|respuesta|estabilidad|equivalente/i;
function parseSyllabus(raw){
  const lines=raw.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l&&!/^(índice|indice|contenidos?|temario)\s*:?$/i.test(l));
  const isHead=l=>HEAD_RE.test(l)||(NUM_HEAD_RE.test(l)&&!SUB_RE.test(l));
  const hasHeads=lines.some(isHead);
  const groups=[];
  for(const l of lines){
    if(!hasHeads||isHead(l)||!groups.length)groups.push({name:l,subs:[]});
    else groups.at(-1).subs.push(l.replace(SUB_RE,'').trim());
  }
  return groups.slice(0,30);
}
function estimate(g,diff){
  const k=0.6+0.2*diff;                 // 0.8 (muy fácil) … 1.6 (muy difícil)
  const n=g.subs.length;
  const text=g.name+' '+g.subs.join(' ');
  const prob=PROB_RE.test(text);
  let h=(n?1+0.6*n:2)*k*(prob?1.2:1);
  h=Math.min(15,Math.max(0.5,Math.round(h*2)/2));
  return {hours:h,kind:prob?'problema':'teoria',focus:n?g.subs.slice(0,6).join(' · ')+(n>6?' · …':''):undefined};
}
function runAI(){
  const s=findS(editing);const raw=$('#newtopics').value.trim();const msg=$('#aimsg');
  if(!raw){msg.textContent='Pega primero el índice del temario en el cuadro de arriba.';return}
  const groups=parseSyllabus(raw);
  if(!groups.length){msg.textContent='No he encontrado temas en ese texto.';return}
  let total=0;
  for(const g of groups){const e=estimate(g,s.difficulty||3);total+=e.hours;
    s.topics.push({id:uid(),name:g.name.slice(0,140),hours:e.hours,studied:0,kind:e.kind,focus:e.focus})}
  $('#newtopics').value='';save();renderSheet();
  $('#aimsg').textContent=`Añadidos ${groups.length} temas (${fmtH(total)}). Revisa las horas: puedes cambiarlas en cada tema.`;
}

function addTopicsManual(){const s=findS(editing);const lines=$('#newtopics').value.split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)return;
  lines.forEach(n=>s.topics.push({id:uid(),name:n.slice(0,140),hours:defaultHours(s),studied:0}));$('#newtopics').value='';save();renderSheet()}

function newSubject(){const s={id:uid(),name:'',exam:'',time:'',difficulty:3,priority:3,color:COLORS[state.subjects.length%COLORS.length],topics:[],reviewStudied:0};state.subjects.push(s);save();openEditor(s.id);setTimeout(()=>$('#s-name')?.focus(),50)}

function loadExample(){
  const t=today();const mk=(name,days,d,p,c,topics)=>({id:uid(),name,exam:addDays(t,days),time:'09:00',difficulty:d,priority:p,color:c,reviewStudied:0,topics:topics.map(([n,h])=>({id:uid(),name:n,hours:h,studied:0}))});
  state.subjects.push(
    mk('Electrónica (ejemplo)',16,4,4,COLORS[0],[['Tema 1. Semiconductores',3],['Tema 2. Diodos y circuitos con diodos',4],['Tema 3. Transistor BJT',5],['Tema 4. MOSFET',4.5],['Tema 5. Amplificadores',5]]),
    mk('Sistemas digitales (ejemplo)',19,3,3,COLORS[2],[['Álgebra de Boole y puertas',2],['Circuitos combinacionales',3],['Biestables',2.5],['Máquinas de estados',4]]),
    mk('Cálculo (ejemplo)',30,3,2,COLORS[4],[['Integrales',4],['Series',3.5],['Ecuaciones diferenciales',5]]));
  save();toast('Ejemplo cargado. Bórralo cuando añadas lo tuyo.');render();
}

/* ---------- render y eventos ---------- */
function render(){
  if(editing&&!$('#sheet').hidden){}
  const v={hoy:vHoy,plan:vPlan,asig:vAsig,ajustes:vAjustes}[tab]();
  $('#view').innerHTML=storeMode==='cargando'?'<p class="muted">Cargando tu plan…</p>':v;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  timerBar();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.tab){tab=ds.tab;try{localStorage.setItem('plan-tab',tab)}catch(_){}render();window.scrollTo(0,0);return}
  if('new' in ds)return newSubject();
  if('example' in ds)return loadExample();
  if(ds.edit)return openEditor(ds.edit);
  if(ds.done)return markDone(ds.done,+ds.h);
  if(ds.undo)return undoDone(ds.undo);
  if(ds.split)return openSplit(ds.split);
  if('splitclose' in ds)return closeSplit();
  if(ds.sstep)return splitStep(ds.sstep,+ds.v);
  if(ds.sedit){splitPending=null;splitEdit=splitEdit===ds.sedit?null:ds.sedit;renderSplit();setTimeout(()=>$('#smin')?.focus(),30);return}
  if('seditcancel' in ds){splitEdit=null;return renderSplit()}
  if(ds.scustom)return splitCustom(+ds.scustom);
  if(ds.spick&&splitPending)return splitApply(splitPending.sid,splitPending.dv,ds.spick);
  if('spickcancel' in ds){splitPending=null;return renderSplit()}
  if('splitsave' in ds)return saveSplit();
  if('splitreset' in ds)return resetSplit();
  if(ds.tstart)return timerStart(ds.tstart,ds.tunit||null,ds.tgoalh!=null&&ds.tgoalh!==''?+ds.tgoalh:null,ds.tuname||'');
  if('tpause' in ds)return timerPause();
  if('tstop' in ds)return timerStop();
  if('tdiscard' in ds)return timerDiscard();
  if(ds.themeSet){state.settings.theme=ds.themeSet;applyTheme();save();return render()}
  if(ds.logopen){logOpen=ds.logopen;logVal=Math.max(0.25,Math.round(+ds.h*4)/4);return render()}
  if(ds.lstep){logVal=Math.max(0.25,Math.min(12,logVal+ +ds.lstep));return render()}
  if(ds.lsave)return markDone(ds.lsave,logVal);
  if('lcancel' in ds){logOpen=null;return render()}
  if(ds.hstep!=null){const i=+ds.hstep;state.settings.hours[i]=Math.max(0,Math.min(16,(+state.settings.hours[i]||0)+ +ds.v));save();render();return}
  if(ds.margin!=null&&ds.margin!==undefined&&'margin' in ds){state.settings.margin=+ds.margin;save();render();return}
  if('export' in ds)return exportData();
  if('import' in ds)return pickImport();
  if('install' in ds)return doInstall();
  if('wipe' in ds){$('#wipe').innerHTML='<span>¿Seguro? Se borran asignaturas, temas y progreso.</span><div class="row"><button class="danger" data-wipeok>Sí, borrar todo</button><button data-wipeno>Cancelar</button></div>';return}
  if('wipeok' in ds){try{localStorage.setItem(KEY+'-antes-de-borrar',JSON.stringify(state))}catch(e){}const th=state.settings.theme;state=structuredClone(DEFAULT);state.settings.theme=th;save();toast('Datos borrados');render();return}
  if('wipeno' in ds)return render();
  // editor
  const s=editing&&findS(editing);if(!s)return;
  if('close' in ds){if(!s.name.trim())s.name='Sin nombre';save();return closeEditor()}
  if(ds.diff){s.difficulty=+ds.diff;save();return renderSheet()}
  if(ds.prio){s.priority=+ds.prio;save();return renderSheet()}
  if(ds.color){s.color=ds.color;save();return renderSheet()}
  if(ds.tdel){s.topics=s.topics.filter(t=>t.id!==ds.tdel);save();return renderSheet()}
  if('addtopics' in ds)return addTopicsManual();
  if('ai' in ds)return runAI();
  if('delsub' in ds){$('#delbox').innerHTML=`<div class="stack"><span>¿Eliminar ${esc(s.name||'esta asignatura')} y todo su progreso?</span><div class="row"><button class="danger" data-delok>Sí, eliminar</button><button data-delno>Cancelar</button></div></div>`;return}
  if('delok' in ds){state.subjects=state.subjects.filter(x=>x.id!==s.id);save();toast('Asignatura eliminada');return closeEditor()}
  if('delno' in ds)return renderSheet();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if('start' in el.dataset){state.settings.start=el.value||'09:00';save();render();return}
  if(el.dataset.hours!=null){state.settings.hours[+el.dataset.hours]=Math.max(0,Math.min(16,+el.value||0));save();render();return}
  const s=editing&&findS(editing);if(!s)return;
  if(el.dataset.f){s[el.dataset.f]=el.value.trim?el.value.trim():el.value;save();if(el.dataset.f!=='name')renderSheet();return}
  if(el.dataset.th){const t=s.topics.find(x=>x.id===el.dataset.th);if(t){t.hours=Math.max(0.5,Math.round((+el.value||0.5)*2)/2);save();renderSheet()}return}
  if(el.dataset.tdone){const t=s.topics.find(x=>x.id===el.dataset.tdone);if(t){t.studied=el.checked?+t.hours:0;save();renderSheet()}return}
});
document.addEventListener('input',e=>{
  const el=e.target;const s=editing&&findS(editing);
  if(s&&el.dataset.f==='name'){s.name=el.value;save()}
});

try{const t=localStorage.getItem('plan-tab');if(t&&['hoy','plan','asig','ajustes'].includes(t))tab=t}catch(e){}
render();
initStore();
</script>
